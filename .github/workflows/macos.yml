name: macOS 앱 및 Python 검증

on:
  push:
    branches: [main, 'feat/**', 'feat-*']
    tags: ['v*', 'macos-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Apple Silicon ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.11
      - name: Python 빌드 환경 설치
        run: |
          test "$(uname -m)" = arm64
          uv python install 3.12.12
          uv venv --python 3.12.12 .venv-app-build
          uv pip sync --python .venv-app-build/bin/python --require-hashes packaging/macos/requirements.lock
      - name: Python 정적 검사와 회귀 테스트
        run: |
          .venv-app-build/bin/ruff check src tests scripts packaging/macos
          PYTHONPATH=src .venv-app-build/bin/python -m pytest
      - name: Swift 빌드와 회귀 테스트
        run: |
          swift build --package-path macos
          swift test --package-path macos
          # 최신 Swift의 swift test가 실행 대상 XCTest 번들을 생략하는 경우도 검증한다.
          test_bin="$(swift build --package-path macos --show-bin-path)"
          if [ -d "$test_bin/HEICConverterTests.xctest" ]; then
            xcrun xctest "$test_bin/HEICConverterTests.xctest"
          else
            # 기존 SwiftPM은 테스트 대상들을 한 패키지 번들로 조립한다.
            xcrun xctest "$test_bin/HEICConverterPackageTests.xctest"
          fi
      - name: 클립보드 진단 도구의 독립 프로세스 검증
        run: .venv-app-build/bin/python packaging/macos/test_clipboard_probe.py
      - name: 앱과 DMG 조립 및 설치본 검증
        # GUI 준비 또는 이미지 attach/verify가 정지해도 job을 무기한 점유하지 않는다.
        timeout-minutes: 20
        run: bash packaging/macos/build.sh
      - name: Python 배포 파일 빌드와 허용 목록 검증
        run: |
          .venv-app-build/bin/python -m build --no-isolation
          .venv-app-build/bin/python packaging/macos/validate_python_dist.py dist
      - name: 검증한 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: heiccy-${{ matrix.os }}-arm64
          path: |
            dist/macos/heiccy-*-arm64.dmg
            dist/macos/heiccy-*-arm64.dmg.sha256
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
