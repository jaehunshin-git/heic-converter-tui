name: macOS 앱 및 Python 검증

on:
  push:
    branches: [main, 'feat/**', 'feat-*']
    tags: ['v*', 'macos-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  # 공개 소스 push 이후 작업이 취소되어 불완전한 배포가 남지 않도록 한다.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/macos-v') }}

jobs:
  validate:
    name: Apple Silicon ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.11.11
      - name: Python 빌드 환경 설치
        run: |
          test "$(uname -m)" = arm64
          uv python install 3.12.12
          uv venv --python 3.12.12 .venv-app-build
          uv pip sync --python .venv-app-build/bin/python --require-hashes packaging/macos/requirements.lock
      - name: Python 정적 검사와 회귀 테스트
        run: |
          .venv-app-build/bin/ruff check src tests scripts packaging/macos packaging/release
          PYTHONPATH=src .venv-app-build/bin/python -m pytest
      - name: Swift 빌드와 회귀 테스트
        run: |
          swift build --package-path macos
          swift test --package-path macos
          # 최신 Swift의 swift test가 실행 대상 XCTest 번들을 생략하는 경우도 검증한다.
          test_bin="$(swift build --package-path macos --show-bin-path)"
          if [ -d "$test_bin/HEICConverterTests.xctest" ]; then
            xcrun xctest "$test_bin/HEICConverterTests.xctest"
          else
            # 기존 SwiftPM은 테스트 대상들을 한 패키지 번들로 조립한다.
            xcrun xctest "$test_bin/HEICConverterPackageTests.xctest"
          fi
      - name: 클립보드 진단 도구의 독립 프로세스 검증
        run: .venv-app-build/bin/python packaging/macos/test_clipboard_probe.py
      - name: 앱과 DMG 조립 및 설치본 검증
        # GUI 준비 또는 이미지 attach/verify가 정지해도 job을 무기한 점유하지 않는다.
        timeout-minutes: 20
        run: bash packaging/macos/build.sh
      - name: Python 배포 파일 빌드와 허용 목록 검증
        run: |
          .venv-app-build/bin/python -m build --no-isolation
          .venv-app-build/bin/python packaging/macos/validate_python_dist.py dist
      - name: 해시 고정 코덱 소스 번들과 빌드 manifest 생성
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_RUNNER: ${{ matrix.os }}
        run: |
          set -euo pipefail
          app_version="$(.venv-app-build/bin/python -c 'import plistlib; print(plistlib.load(open("packaging/macos/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          .venv-app-build/bin/python packaging/release/collect_codec_sources.py dist/macos --version "$app_version"
          .venv-app-build/bin/python packaging/release/verify_release.py manifest \
            --directory dist/macos --runner "$BUILD_RUNNER" \
            --source-repository "$SOURCE_REPOSITORY" --source-commit "$SOURCE_COMMIT" \
            --source-ref "$SOURCE_REF" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
      - name: 검증한 산출물 업로드
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heiccy-${{ matrix.os }}-arm64
          path: |
            dist/macos/heiccy-*-arm64.dmg
            dist/macos/heiccy-*-arm64.dmg.sha256
            dist/macos/heiccy-codec-sources-*.tar.gz
            dist/macos/heiccy-codec-sources-*.tar.gz.sha256
            dist/macos/release-manifest-*.json
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: 검증한 앱과 공개 소스의 draft 릴리스
    needs: validate
    # 환경과 전용 토큰을 준비한 뒤 저장소 변수로 명시적으로 활성화한다.
    # Python v* 태그, 수동 실행, feature 브랜치는 공개 DMG를 게시하지 않는다.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/macos-v') &&
      needs.validate.result == 'success' &&
      vars.HEICCY_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: read
      actions: read
    concurrency:
      group: heiccy-public-release
      cancel-in-progress: false
    env:
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_TAG: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: 내부 소스 checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 내부 main 병합 확인
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
      - name: macOS 15의 검증 원본 다운로드
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: heiccy-macos-15-arm64
          path: build/release-artifacts/macos-15
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: macOS 26의 검증 원본 다운로드
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: heiccy-macos-26-arm64
          path: build/release-artifacts/macos-26
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 태그·버전·두 OS 출처와 모든 배포 해시 검증
        id: verified
        run: |
          set -euo pipefail
          python packaging/release/verify_release.py verify \
            --macos-15 build/release-artifacts/macos-15/macos \
            --macos-26 build/release-artifacts/macos-26/macos \
            --tag "$SOURCE_TAG" --source-repository "$SOURCE_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --output "$GITHUB_OUTPUT" --notes-output build/release-notes.md
      - name: 공개 전용 토큰 준비 확인
        env:
          GH_TOKEN: ${{ secrets.HEICCY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'public-release 환경에 HEICCY_RELEASE_TOKEN을 설정해야 합니다.' >&2
            exit 1
          fi
      - name: 공개 저장소 checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jaehunshin-git/heiccy
          token: ${{ secrets.HEICCY_RELEASE_TOKEN }}
          path: build/public-repo
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: 기존 공개 태그와 draft 덮어쓰기 거부
        env:
          GH_TOKEN: ${{ secrets.HEICCY_RELEASE_TOKEN }}
          PUBLIC_TAG: ${{ steps.verified.outputs.public_tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          tags="$(gh api "repos/jaehunshin-git/heiccy/git/matching-refs/tags/$PUBLIC_TAG" \
            --jq '.[].ref')"
          releases="$(gh api --paginate repos/jaehunshin-git/heiccy/releases --jq '.[].tag_name')"
          if printf '%s\n' "$tags" | grep -Fxq "refs/tags/$PUBLIC_TAG" || \
             printf '%s\n' "$releases" | grep -Fxq "$PUBLIC_TAG"; then
            echo '공개 태그 또는 draft 릴리스가 이미 있습니다. 덮어쓰지 않습니다.' >&2
            exit 1
          fi
      - name: 공개 허용 목록 export와 소스 매핑 검증
        env:
          APP_VERSION: ${{ steps.verified.outputs.version }}
        run: |
          set -euo pipefail
          python packaging/release/export_public.py build/public-repo --source-commit "$SOURCE_COMMIT" --sync
          python packaging/release/verify_release.py snapshot build/public-repo \
            --source-commit "$SOURCE_COMMIT" --version "$APP_VERSION"
      - name: 공개 스냅샷 커밋과 태그를 함께 push
        id: public_source
        env:
          GH_TOKEN: ${{ secrets.HEICCY_RELEASE_TOKEN }}
          PUBLIC_TAG: ${{ steps.verified.outputs.public_tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          case "$(git -C build/public-repo remote get-url origin)" in
            https://github.com/jaehunshin-git/heiccy|https://github.com/jaehunshin-git/heiccy.git) ;;
            *) echo '공개 push 대상 저장소가 다릅니다.' >&2; exit 1 ;;
          esac
          git -C build/public-repo config user.name 'github-actions[bot]'
          git -C build/public-repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C build/public-repo add -A
          git -C build/public-repo commit -m "$PUBLIC_TAG 공개 소스 스냅샷"
          public_commit="$(git -C build/public-repo rev-parse HEAD)"
          git -C build/public-repo tag "$PUBLIC_TAG" "$public_commit"
          # 전용 환경 토큰만 사용하며 로컬 인증이나 내부 github.token을 재사용하지 않는다.
          # main과 태그 중 하나라도 충돌하면 둘 다 push하지 않는다.
          git -C build/public-repo -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' \
            push --atomic origin HEAD:refs/heads/main "refs/tags/$PUBLIC_TAG"
          printf 'commit=%s\n' "$public_commit" >> "$GITHUB_OUTPUT"
      - name: 공개 커밋 provenance와 draft 생성
        env:
          GH_TOKEN: ${{ secrets.HEICCY_RELEASE_TOKEN }}
          PUBLIC_TAG: ${{ steps.verified.outputs.public_tag }}
          PUBLIC_COMMIT: ${{ steps.public_source.outputs.commit }}
          DMG: ${{ steps.verified.outputs.dmg }}
          CHECKSUM: ${{ steps.verified.outputs.checksum }}
          CODEC_SOURCES: ${{ steps.verified.outputs.codec_sources }}
          CODEC_CHECKSUM: ${{ steps.verified.outputs.codec_checksum }}
          MANIFEST_15: ${{ steps.verified.outputs.manifest_15 }}
          MANIFEST_26: ${{ steps.verified.outputs.manifest_26 }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          actual="$(gh api "repos/jaehunshin-git/heiccy/git/ref/tags/$PUBLIC_TAG" --jq '.object.sha')"
          test "$actual" = "$PUBLIC_COMMIT"
          # 원본 OS별 manifest는 보존하고 공개 커밋 연결 기록을 별도로 첨부한다.
          python packaging/release/verify_release.py provenance \
            --manifest-15 "$MANIFEST_15" --manifest-26 "$MANIFEST_26" \
            --public-commit "$PUBLIC_COMMIT" --output build/release-source.json
          printf '\n- 공개 소스 커밋: `%s`\n' "$PUBLIC_COMMIT" >> build/release-notes.md
          # create만 사용한다. 기존 release edit/upload, --clobber, 자동 공개는 허용하지 않는다.
          gh release create "$PUBLIC_TAG" "$DMG" "$CHECKSUM" \
            "$MANIFEST_15" "$MANIFEST_26" "$CODEC_SOURCES" "$CODEC_CHECKSUM" build/release-source.json \
            --repo jaehunshin-git/heiccy --verify-tag --draft \
            --title "heiccy $PUBLIC_TAG" --notes-file build/release-notes.md
