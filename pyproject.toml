[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heic-converter-tui"
version = "0.2.3"
description = "방향키 TUI와 CLI로 HEIC 이미지를 JPEG 또는 PNG로 변환하는 도구"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["heic", "jpeg", "png", "converter", "tui", "macos"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "pillow>=10.0",
  "pillow-heif>=0.18",
  "questionary>=2.0.1",
  "rich>=13.0",
  "typer>=0.12",
]

[project.scripts]
heic-converter = "heic_converter.cli:run"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.14",
]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
ignore = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["src/heic_converter"]
